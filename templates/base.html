<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FitBuddy{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--ink:#2b2340;--muted:#6b6485;--accent:#ff5a7a;--accent2:#7c5cff;--teal:#19c3b1}
  body{margin:0;min-height:100vh;font-family:'Roboto',sans-serif;color:var(--ink);
    background:
      linear-gradient(135deg,rgba(255,138,128,.55) 0%,rgba(255,196,102,.45) 28%,rgba(102,214,201,.5) 60%,rgba(124,92,255,.55) 100%),
      url('/static/images/gym.jpg') center/cover fixed,#ffd9c7}
  nav{display:flex;gap:20px;padding:16px 24px;align-items:center}
  nav .brand{font-weight:900;font-size:1.5rem;margin-right:auto;text-decoration:none;
    background:linear-gradient(90deg,#ff3d6e,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav a{color:var(--ink);text-decoration:none;font-weight:700} nav a:hover{color:var(--accent)}
  .wrap{display:flex;justify-content:center;padding:16px}
  .card{background:rgba(255,255,255,.88);border-radius:18px;padding:28px;width:100%;max-width:760px;
    box-shadow:0 10px 35px rgba(90,50,140,.25);margin-bottom:20px;border-top:5px solid var(--accent);
    backdrop-filter:blur(6px)}
  .card:nth-of-type(3n+2){border-top-color:var(--teal)} .card:nth-of-type(3n){border-top-color:var(--accent2)}
  h1,h2{margin-top:0} h1{font-weight:900} h1,h2{color:var(--ink)}
  label{display:block;margin:14px 0 6px;font-weight:700}
  input,select,textarea{width:100%;padding:11px;border-radius:10px;border:2px solid #e2d9f5;background:#fff;color:var(--ink);font:inherit}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
  button,.btn{margin-top:18px;padding:12px 22px;border:0;border-radius:10px;
    background:linear-gradient(90deg,#ff5a7a,#ff9a44);color:#fff;
    font-weight:700;cursor:pointer;font-size:1rem;transition:.2s;box-shadow:0 4px 14px rgba(255,90,122,.4)}
  button:hover,.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .danger{background:linear-gradient(90deg,#e0435a,#c62f4a);margin:0;padding:6px 12px;font-size:.85rem;box-shadow:none}
  pre{white-space:pre-wrap;word-wrap:break-word;font-family:inherit;background:#f4efff;padding:16px;border-radius:10px;line-height:1.55;border:1px solid #e2d9f5}
  .tip{border-left:5px solid var(--teal);background:#e6faf7;padding:14px;border-radius:8px}
  .msg{background:#d9f7e8;color:#12563a;padding:12px;border-radius:10px;margin-bottom:16px;font-weight:700}
  .err{background:#ffe1e4;color:#8f1d33;padding:12px;border-radius:10px;margin-bottom:16px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .stats span{display:block;color:var(--muted);font-size:.8rem}
  table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid #e2d9f5;text-align:left;vertical-align:top}
  th{color:var(--accent2)}
  details summary{cursor:pointer;color:var(--accent2);font-weight:700}
  @media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body>
<nav><a class="brand" href="/">💪 FitBuddy</a><a href="/">New Plan</a><a href="/view-all-users">Admin</a></nav>
<div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
