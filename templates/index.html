{% extends "base.html" %}
{% block title %}FitBuddy - AI Workout Generator{% endblock %}
{% block content %}
<div class="card">
  <h1>FitBuddy – AI Workout Generator</h1>
  <p>Tell us about yourself and get a personalized 7-day plan plus a nutrition tip.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form action="/generate-workout" method="post">
    <div class="grid">
      <div><label for="username">Name</label><input id="username" name="username" required></div>
      <div><label for="user_id">User ID</label><input id="user_id" name="user_id" required></div>
      <div><label for="age">Age</label><input id="age" name="age" type="number" min="10" max="100" required></div>
      <div><label for="weight">Weight (kg)</label><input id="weight" name="weight" type="number" step="0.1" min="1" required></div>
    </div>
    <label for="goal">Fitness Goal</label>
    <select id="goal" name="goal">
      <option>Weight loss</option><option>Muscle gain</option><option>General wellness</option><option>Flexibility</option><option>Endurance</option>
    </select>
    <label for="intensity">Workout Intensity</label>
    <select id="intensity" name="intensity"><option>Low</option><option selected>Medium</option><option>High</option></select>
    <button type="submit">Generate Plan</button>
  </form>
</div>
{% endblock %}
